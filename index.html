<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>தாஸ் நிதி கருவிகள்</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Noto Sans Tamil', 'Arial', sans-serif;
        background: #f0f2f5;
        min-height: 100vh;
    }

    /* ===== Login Gate ===== */
    #loginGate {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #1a2a6c, #2c3e50);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 20px;
    }
    .gate-card {
        background: white;
        border-radius: 16px;
        padding: 40px 35px;
        width: 100%;
        max-width: 380px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .gate-card i.fa-users {
        font-size: 3rem;
        color: #2c3e50;
        margin-bottom: 15px;
    }
    .gate-card h2 {
        color: #2c3e50;
        margin-bottom: 8px;
    }
    .gate-card p {
        color: #777;
        margin-bottom: 22px;
        font-size: 0.92rem;
    }
    .gate-card label {
        display: block;
        text-align: left;
        font-size: 0.85rem;
        color: #555;
        margin-bottom: 5px;
        margin-top: 12px;
    }
    .gate-card select,
    .gate-card input {
        width: 100%;
        padding: 12px 14px;
        border: 2px solid #ddd;
        border-radius: 10px;
        font-size: 1rem;
        margin-bottom: 4px;
    }
    .gate-card select:focus,
    .gate-card input:focus {
        outline: none;
        border-color: #3498db;
    }
    .gate-card button {
        width: 100%;
        padding: 14px;
        background: #2c3e50;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1.05rem;
        cursor: pointer;
        font-weight: 600;
        margin-top: 18px;
    }
    .gate-card button:hover { background: #1a2a3c; }
    .gate-error {
        color: #e74c3c;
        margin-top: 12px;
        font-size: 0.9rem;
        min-height: 20px;
    }
    .gate-config-note {
        margin-top: 15px;
        font-size: 0.78rem;
        color: #999;
        text-align: left;
        background: #fff8e1;
        padding: 10px;
        border-radius: 8px;
        display: none;
    }

    /* ===== Main App ===== */
    #mainApp { display: none; }

    .app-header {
        background: #2c3e50;
        color: white;
        padding: 14px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }
    .app-header h1 {
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .app-header .user-badge {
        font-size: 0.8rem;
        font-weight: normal;
        background: rgba(255,255,255,0.15);
        padding: 3px 10px;
        border-radius: 12px;
        margin-left: 8px;
    }
    .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .sync-status {
        font-size: 0.78rem;
        color: #cfd8e3;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .header-actions button {
        background: rgba(255,255,255,0.15);
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
    }
    .header-actions button:hover { background: rgba(255,255,255,0.28); }

    .tab-bar {
        display: flex;
        background: white;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        overflow-x: auto;
    }
    .tab-btn {
        flex: 1;
        min-width: 200px;
        padding: 16px 20px;
        background: none;
        border: none;
        border-bottom: 4px solid transparent;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        color: #555;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: 0.2s;
    }
    .tab-btn:hover { background: #f8f9fb; }
    .tab-btn.active {
        color: #2c3e50;
        border-bottom-color: #3498db;
        background: #f0f4f8;
    }

    .tab-panels {
        position: relative;
        height: calc(100vh - 116px);
    }
    .tab-panel {
        display: none;
        width: 100%;
        height: 100%;
    }
    .tab-panel.active { display: block; }
    .tab-panel iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
    .panel-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #888;
        gap: 15px;
    }
    .panel-loading i {
        font-size: 2.5rem;
        color: #3498db;
    }
</style>
</head>
<body>

<!-- Login Gate -->
<div id="loginGate">
    <div class="gate-card">
        <i class="fas fa-users"></i>
        <h2>தாஸ் நிதி கருவிகள்</h2>
        <p>உங்கள் பெயரையும் கடவுச்சொல்லையும் உள்ளிடவும்</p>

        <label for="loginName">பெயர்</label>
        <select id="loginName">
            <option value="">-- ஏற்றுகிறது... --</option>
        </select>

        <label for="loginPassword">கடவுச்சொல்</label>
        <input type="password" id="loginPassword" placeholder="கடவுச்சொல்" autocomplete="off">

        <button onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> நுழைக</button>
        <div class="gate-error" id="gateError"></div>
        <div class="gate-config-note" id="configNote">
            <i class="fas fa-exclamation-triangle"></i> Cloud sync இன்னும் அமைக்கப்படவில்லை. index.html கோப்பில் <code>GAS_CONFIG.url</code>-ஐ உங்கள் Apps Script Web App URL-ஆல் மாற்றவும்.
        </div>
    </div>
</div>

<!-- Main App -->
<div id="mainApp">
    <div class="app-header">
        <h1><i class="fas fa-wallet"></i> தாஸ் நிதி கருவிகள் <span class="user-badge" id="userBadge"></span></h1>
        <div class="header-actions">
            <span class="sync-status" id="syncStatus"><i class="fas fa-check-circle"></i> Sync ஆகியது</span>
            <span class="sync-status" id="lastEditorStatus"><i class="fas fa-user-edit"></i> <span id="lastEditorName">-</span></span>
            <button onclick="manualSync()"><i class="fas fa-sync"></i> இப்போதே Sync</button>
            <button onclick="lockApp()"><i class="fas fa-lock"></i> வெளியேறு</button>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" id="tabBtn-finance" onclick="switchToolTab('finance')">
            <i class="fas fa-home"></i> வரவு செலவு மேலாண்மை
        </button>
        <button class="tab-btn" id="tabBtn-kadan" onclick="switchToolTab('kadan')">
            <i class="fas fa-file-invoice-dollar"></i> கணக்கு மேலாளர்
        </button>
    </div>

    <div class="tab-panels">
        <div class="tab-panel active" id="panel-finance">
            <div class="panel-loading"><i class="fas fa-spinner fa-spin"></i> ஏற்றுகிறது...</div>
        </div>
        <div class="tab-panel" id="panel-kadan">
            <div class="panel-loading"><i class="fas fa-spinner fa-spin"></i> ஏற்றுகிறது...</div>
        </div>
    </div>
</div>

    const loadedTabs = {};
    let currentUserName = null;
    let syncTimer = null;

    function base64ToUtf8(b64) {
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder('utf-8').decode(bytes);
    }

    function isGasConfigured() {
        return GAS_CONFIG.enabled && GAS_CONFIG.url && !GAS_CONFIG.url.includes('PASTE_YOUR');
    }

    // எல்லா Apps Script அழைப்புகளும் POST மூலமாகவே - GET-ல் CORS பிரச்சினை வரலாம் என்பதால்
    function gasCall(payload) {
        if (!isGasConfigured()) return Promise.resolve(null);
        return fetch(GAS_CONFIG.url, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        }).then(res => res.json())
          .catch(err => { console.error('GAS அழைப்பு பிழை:', err); return null; });
    }

    function switchToolTab(tabId, forceReload) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));

        document.getElementById(`tabBtn-${tabId}`).classList.add('active');
        document.getElementById(`panel-${tabId}`).classList.add('active');

        if (!loadedTabs[tabId] || forceReload) {
            const html = base64ToUtf8(TOOL_DATA[tabId]);
            const iframe = document.createElement('iframe');
            iframe.srcdoc = html;
            document.getElementById(`panel-${tabId}`).innerHTML = '';
            document.getElementById(`panel-${tabId}`).appendChild(iframe);
            loadedTabs[tabId] = true;
        }
    }

    // ===== லாகின் =====
    function loadUserList() {
        const select = document.getElementById('loginName');
        if (!isGasConfigured()) {
            select.innerHTML = '<option value="">-- Cloud sync அமைக்கப்படவில்லை --</option>';
            document.getElementById('configNote').style.display = 'block';
            return;
        }
        gasCall({ action: 'getUsers' }).then(result => {
            if (result && result.status === 'ok' && result.names.length) {
                select.innerHTML = result.names.map(n => `<option value="${n}">${n}</option>`).join('');
                document.getElementById('configNote').style.display = 'none';
            } else {
                select.innerHTML = '<option value="">-- பயனர்களை ஏற்ற முடியவில்லை --</option>';
                document.getElementById('configNote').innerHTML =
                    '<i class="fas fa-exclamation-triangle"></i> Apps Script URL-ஐ தொடர்பு கொள்ள முடியவில்லை. Deploy செய்தபோது "Who has access: Anyone" என அமைத்திருக்கீர்களா என சரிபார்க்கவும்.';
                document.getElementById('configNote').style.display = 'block';
            }
        });
    }

    function doLogin() {
        const name = document.getElementById('loginName').value;
        const password = document.getElementById('loginPassword').value;
        const errorEl = document.getElementById('gateError');

        if (!name || !password) {
            errorEl.textContent = 'பெயர் மற்றும் கடவுச்சொல்லை உள்ளிடவும்';
            return;
        }

        errorEl.textContent = 'சரிபார்க்கிறது...';

        gasCall({ action: 'login', name: name, password: password }).then(result => {
            if (result && result.status === 'ok') {
                currentUserName = result.name;
                sessionStorage.setItem('dhassFinanceUser', currentUserName);
                errorEl.textContent = '';
                enterApp();
            } else {
                errorEl.textContent = (result && result.message) || 'தவறான பெயர்/கடவுச்சொல்';
            }
        });
    }

    function enterApp() {
        document.getElementById('loginGate').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('userBadge').textContent = currentUserName;

        // முதலில் cloud-லிருந்து சமீபத்திய தரவை இழுத்து, பிறகு tool-ஐ காட்டு
        pullFromCloud().then(() => {
            switchToolTab('finance');
            startAutoSync();
        });
    }

    function lockApp() {
        stopAutoSync();
        sessionStorage.removeItem('dhassFinanceUser');
        currentUserName = null;
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('loginGate').style.display = 'flex';
        document.getElementById('loginPassword').value = '';
        document.getElementById('gateError').textContent = '';
    }

    // ===== Cloud Sync =====
    function setSyncStatus(text, isError) {
        const el = document.getElementById('syncStatus');
        el.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${text}`;
        el.style.color = isError ? '#f1c40f' : '#cfd8e3';
    }

    function pullFromCloud() {
        if (!isGasConfigured()) {
            setSyncStatus('Cloud sync இல்லை', true);
            return Promise.resolve();
        }
        setSyncStatus('Sync ஆகிறது...');

        return gasCall({ action: 'getData' }).then(result => {
            if (!result || result.status !== 'ok') {
                setSyncStatus('Sync பிழை', true);
                return;
            }

            let changedActive = false;
            let mostRecentEditor = null;
            let mostRecentTime = 0;

            TRACKED_KEYS.forEach(key => {
                const remote = result.data[key];
                if (!remote || !remote.value) return;

                const localUpdatedKey = `_sync_updated_${key}`;
                const lastKnownUpdated = parseInt(localStorage.getItem(localUpdatedKey) || '0', 10);

                if (remote.updated > lastKnownUpdated) {
                    localStorage.setItem(key, remote.value);
                    localStorage.setItem(localUpdatedKey, String(remote.updated));
                    changedActive = true;
                }

                if (remote.updated > mostRecentTime) {
                    mostRecentTime = remote.updated;
                    mostRecentEditor = remote.editor;
                }
            });

            if (mostRecentEditor) {
                document.getElementById('lastEditorName').textContent =
                    `${mostRecentEditor} (${new Date(mostRecentTime).toLocaleString('ta-IN')})`;
            }

            if (changedActive) {
                // தற்போது திறந்திருக்கும் tab-ஐ புதிய தரவுடன் மீண்டும் ஏற்றவும்
                const activeTabId = document.querySelector('.tab-btn.active').id.replace('tabBtn-', '');
                switchToolTab(activeTabId, true);
                loadedTabs['finance'] = activeTabId === 'finance';
                loadedTabs['kadan'] = activeTabId === 'kadan';
            }

            setSyncStatus('Sync ஆகியது · ' + new Date().toLocaleTimeString('ta-IN'));
        });
    }

    function pushToCloud() {
        if (!isGasConfigured()) return Promise.resolve();

        const items = TRACKED_KEYS
            .map(key => ({ key: key, value: localStorage.getItem(key) }))
            .filter(item => item.value !== null && item.value !== undefined);

        if (items.length === 0) return Promise.resolve();

        return gasCall({ action: 'saveData', items: items, editor: currentUserName || '' }).then(result => {
            if (result && result.status === 'ok') {
                TRACKED_KEYS.forEach(key => {
                    localStorage.setItem(`_sync_updated_${key}`, String(result.updated));
                });
            }
        });
    }

    function manualSync() {
        setSyncStatus('Sync ஆகிறது...');
        pushToCloud().then(() => pullFromCloud());
    }

    function startAutoSync() {
        stopAutoSync();
        syncTimer = setInterval(() => {
            pushToCloud().then(() => pullFromCloud());
        }, SYNC_INTERVAL_MS);

        // ஒரு tab-லிருந்து மறு tab-க்கு மாறும்போதும், பக்கத்தை மூடும் முன்னும் push செய்யவும்
        window.addEventListener('beforeunload', () => { pushToCloud(); });
    }

    function stopAutoSync() {
        if (syncTimer) clearInterval(syncTimer);
        syncTimer = null;
    }

    // ===== தொடக்கம் =====
    window.addEventListener('DOMContentLoaded', () => {
        loadUserList();

        document.getElementById('loginPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doLogin();
        });

        const savedUser = sessionStorage.getItem('dhassFinanceUser');
        if (savedUser) {
            currentUserName = savedUser;
            enterApp();
        }
    });
</script>

</body>
</html>
